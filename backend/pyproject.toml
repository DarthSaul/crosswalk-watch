[project]
name = "crosswalk-watch-backend"
version = "0.1.0"
description = "FastAPI backend for the Crosswalk Watch CV playground"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<3",
    "ultralytics>=8.3",
    "supervision>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
